<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video Reel Web</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; color: #111; }
    header { padding: 12px 16px; border-bottom: 1px solid #eee; display: flex; gap: 12px; align-items: center; }
    .container { padding: 16px; }
    .tabs { display: flex; gap: 8px; border-bottom: 1px solid #eee; }
    .tab { padding: 10px 12px; cursor: pointer; border: 1px solid #eee; border-bottom: none; border-radius: 8px 8px 0 0; background: #fafafa; }
    .tab.active { background: #fff; font-weight: 600; }
    .tabpanes > section { display: none; padding: 16px; border: 1px solid #eee; border-top: none; border-radius: 0 8px 8px 8px; background: #fff; }
    .tabpanes > section.active { display: block; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .row { grid-template-columns: 1fr; } }

    .upload { border: 1px dashed #bbb; padding: 12px; border-radius: 8px; background: #fafafa; }
    .materials { display: grid; gap: 12px; }
    .card { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px; border: 1px solid #eee; border-radius: 8px; }
    .thumb { width: 110px; height: 110px; object-fit: cover; border-radius: 6px; background: #f2f2f2; }
    textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid #ddd; border-radius: 6px; padding: 8px; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; }
    .btn.primary { background: #111; color: #fff; border-color: #111; }
    .muted { color: #666; font-size: 12px; }
    pre.log { white-space: pre-wrap; background: #0b1020; color: #d6e0ff; padding: 12px; border-radius: 8px; min-height: 240px; }
    .divider { height: 1px; background: #eee; margin: 16px 0; }
    select, input[type="checkbox"] { padding: 6px; }
    label { font-size: 14px; }
  </style>
</head>
<body>
<header>
  <h3 style="margin:0;">Video Reel Web</h3>
  <div class="muted">アカウントを選んで素材を投稿できます</div>
</header>

<div class="container">
  <div class="tabs">
    <div class="tab active" data-tab="post">投稿</div>
    <div class="tab" data-tab="random">ランダムテキスト</div>
    <div class="tab" data-tab="logs">投稿ログ</div>
  </div>

  <div class="tabpanes">
    <!-- 投稿 -->
    <section id="pane-post" class="active">
      <form class="upload" action="/upload" method="post" enctype="multipart/form-data">
        <div class="controls">
          <input type="file" name="file" accept="video/*,image/*" />
          <button class="btn">素材をアップロード</button>
          <span class="muted">static/overlay_input に保存されます</span>
        </div>
      </form>

      <div class="divider"></div>

      <div class="controls" style="margin-bottom:12px;">
        <label>アカウント:
          <select id="account_no">
            {% for a in accounts %}
              <option value="{{ a.no|default(a['no']) }}">{{ a.label or a.no }}</option>
            {% endfor %}
          </select>
        </label>
        <label><input type="checkbox" id="all_accounts"> 全アカウントで投稿</label>
        <label><input type="checkbox" id="share_to_feed"> フィードにも共有</label>
      </div>

      <div class="row">
        <div>
          <div class="materials" id="materials">
            {% for m in materials %}
              <div class="card" data-filename="{{ m.filename }}">
                <img class="thumb" src="{{ m.thumb_url }}" alt="">
                <div>
                  <!-- 右側コメント（素材と1:1）-->
                  <textarea class="comment" placeholder="コメント（空ならランダム使用）">{{ m.comment }}</textarea>
                  <div class="controls" style="margin-top:8px;">
                    <button class="btn primary btn-post-one">この素材を投稿</button>
                    <span class="muted">{{ m.filename }}</span>
                  </div>
                </div>
              </div>
            {% endfor %}
          </div>
        </div>

        <div>
          <div class="controls" style="margin-bottom:12px;">
            <button id="btn-post-all" class="btn primary">並び順で全部投稿</button>
            <button id="btn-save-order" class="btn">今の順序を保存</button>
            <span class="muted">カードの順序はブラウザの並び順→保存で固定</span>
          </div>
          <div>
            <h4 style="margin:12px 0 6px;">ヒント</h4>
            <ul class="muted">
              <li>コメントを空にすると <code>random_texts.txt</code> からランダム選択</li>
              <li>アカウント番号に合う背景（<code>backgrounds/1.mp4</code> 等）を自動マッチ</li>
              <li>動画/画像のサムネは自動生成</li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <!-- ランダムテキスト -->
    <section id="pane-random">
      <div class="controls" style="margin-bottom:8px;">
        <button id="btn-save-random" class="btn primary">ランダムテキストを保存</button>
        <span class="muted">1行=1候補。保存すると即ファイルに反映</span>
      </div>
      <textarea id="random-body" style="min-height:300px;">{{ random_texts }}</textarea>
    </section>

    <!-- 投稿ログ -->
    <section id="pane-logs">
      <div class="controls" style="margin-bottom:8px;">
        <button class="btn" data-log="ig">IGログ</button>
        <button class="btn" data-log="core">合成ログ</button>
        <button class="btn primary" data-log="all">全部</button>
      </div>
      <pre id="log-view" class="log">読み込み中...</pre>
    </section>
  </div>
</div>

<script>
  // --- タブ切替 ---
  const tabs = document.querySelectorAll('.tab');
  const panes = {
    post: document.getElementById('pane-post'),
    random: document.getElementById('pane-random'),
    logs: document.getElementById('pane-logs'),
  };
  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      Object.values(panes).forEach(p => p.classList.remove('active'));
      panes[t.dataset.tab].classList.add('active');
      if (t.dataset.tab === 'logs') {
        loadLogs('all'); // 初回表示で読み込む
      }
    });
  });

  // --- コメント保存（1:1 即時反映） ---
  document.querySelectorAll('.card').forEach(card => {
    const ta = card.querySelector('textarea.comment');
    const filename = card.dataset.filename;
    let timer = null;
    ta.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        fetch('/api/override', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ filename, text: ta.value || "" })
        });
      }, 300);
    });

    // 個別投稿
    const btn = card.querySelector('.btn-post-one');
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      const fd = new FormData();
      fd.append('account_no', document.getElementById('account_no').value);
      fd.append('filename', filename);
      fd.append('comment', ta.value || "");
      fd.append('share_to_feed', document.getElementById('share_to_feed').checked ? 'on' : '');
      btn.disabled = true; btn.textContent = '投稿中…';
      try {
        const r = await fetch('/publish_selected', { method: 'POST', body: fd });
        const js = await r.json();
        alert(js.ok ? ('OK: ' + (js.media_id || 'done')) : ('投稿失敗: ' + (js.error || 'unknown')));
        loadLogs('ig');
      } catch (err) {
        alert('投稿失敗: ' + err);
      } finally {
        btn.disabled = false; btn.textContent = 'この素材を投稿';
      }
    });
  });

  // 並び順保存
  document.getElementById('btn-save-order').addEventListener('click', async (e) => {
    e.preventDefault();
    const order = Array.from(document.querySelectorAll('.card')).map(c => c.dataset.filename);
    const r = await fetch('/api/materials_order', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ order })
    });
    const js = await r.json();
    alert(js.ok ? '順序を保存しました' : ('保存失敗: ' + (js.error || 'unknown')));
  });

  // 全部投稿
  document.getElementById('btn-post-all').addEventListener('click', async (e) => {
    e.preventDefault();
    const fd = new FormData();
    fd.append('account_no', document.getElementById('account_no').value);
    fd.append('all_accounts', document.getElementById('all_accounts').checked ? 'on' : '');
    fd.append('share_to_feed', document.getElementById('share_to_feed').checked ? 'on' : '');
    const btn = document.getElementById('btn-post-all');
    btn.disabled = true; btn.textContent = '投稿中…';
    try {
      const r = await fetch('/publish_all_ordered', { method: 'POST', body: fd });
      const js = await r.json();
      if (js.ok) {
        const ok = js.results.filter(x => x.ok).length;
        const ng = js.results.length - ok;
        alert(`完了: OK ${ok} / NG ${ng}`);
      } else {
        alert('投稿失敗: ' + (js.error || 'unknown'));
      }
      loadLogs('ig');
    } catch (err) {
      alert('投稿失敗: ' + err);
    } finally {
      btn.disabled = false; btn.textContent = '並び順で全部投稿';
    }
  });

  // ランダムテキスト保存
  document.getElementById('btn-save-random').addEventListener('click', async () => {
    const body = document.getElementById('random-body').value || '';
    const r = await fetch('/api/random_texts', { method: 'POST', body });
    const js = await r.json();
    alert(js.ok ? '保存しました' : ('失敗: ' + (js.error || 'unknown')));
  });

  // 投稿ログ表示
  function loadLogs(which) {
    const view = document.getElementById('log-view');
    view.textContent = '読み込み中...';
    fetch('/api/logs?name=' + encodeURIComponent(which || 'all'))
      .then(r => r.text())
      .then(t => { view.textContent = t || '(ログなし)'; })
      .catch(e => { view.textContent = '読み込み失敗: ' + e; });
  }
  document.querySelectorAll('#pane-logs .btn').forEach(b => {
    b.addEventListener('click', () => loadLogs(b.dataset.log));
  });
</script>
</body>
</html>
