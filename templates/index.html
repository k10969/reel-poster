<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reel Poster</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";margin:0;background:#0b0b0b;color:#fff}
    header{padding:12px 16px;border-bottom:1px solid #222;display:flex;gap:12px;align-items:center}
    main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px}
    aside{border-right:1px solid #222;padding-right:12px}
    .mat{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px}
    .mat:hover{background:#151515}
    .thumb{width:64px;height:64px;object-fit:cover;background:#222;border-radius:6px}
    .row{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;margin-bottom:8px}
    textarea,input,select,button{background:#141414;color:#fff;border:1px solid #2a2a2a;border-radius:8px;padding:8px}
    textarea{width:100%;min-height:56px;resize:vertical}
    .btn{cursor:pointer}
    .btn.primary{background:#1e88e5;border-color:#1e88e5}
    .btn.ghost{background:transparent}
    .pill{display:inline-flex;align-items:center;gap:8px}
    .tabs{display:flex;gap:8px;border-bottom:1px solid #222;margin:0 16px}
    .tab{padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;color:#aaa}
    .tab.active{color:#fff;border-color:#1e88e5}
    .hidden{display:none}
    .log{white-space:pre-wrap;background:#0f0f0f;border:1px solid #222;border-radius:8px;padding:8px}
  </style>
</head>
<body>
<header>
  <strong>Reel Poster</strong>
  <div class="row" style="grid-template-columns:120px 220px;margin:0;">
    <label>アカウント</label>
    <select id="accountSelect"></select>
  </div>
  <label class="pill">
    <input id="shareToFeed" type="checkbox" />
    フィードにも共有
  </label>
  <button class="btn primary" id="btnPostSelected">選択投稿</button>
  <button class="btn" id="btnPostAll">全投稿</button>
</header>

<nav class="tabs">
  <div class="tab active" data-tab="tab-post">投稿</div>
  <div class="tab" data-tab="tab-random">ランダムテキスト</div>
  <div class="tab" data-tab="tab-accounts">アカウント</div>
  <div class="tab" data-tab="tab-logs">投稿ログ</div>
</nav>

<main id="tab-post" class="tabpane">
  <aside>
    <div id="materials"></div>
    <div style="margin-top:12px">
      <input id="fileInput" type="file" multiple accept="image/*,video/*" />
      <button class="btn" id="btnUpload">素材追加</button>
    </div>
  </aside>
  <section>
    <div id="commentList"></div>
  </section>
</main>

<main id="tab-random" class="tabpane hidden">
  <section style="grid-column: 1 / -1;">
    <p>1行につき1候補。空欄が来た素材はここからランダムで使う。</p>
    <textarea id="randomTexts" placeholder="例：\nこの後どうなる？\n続きはプロフから\n…"></textarea>
    <div style="margin-top:8px">
      <button class="btn primary" id="btnSaveRandom">保存</button>
      <span id="randStatus"></span>
    </div>
  </section>
</main>

<main id="tab-accounts" class="tabpane hidden">
  <section style="grid-column: 1 / -1;">
    <p>accounts.json を編集（no / ig_user_id / page_id / page_token …）。</p>
    <textarea id="accountsJson" style="min-height:240px"></textarea>
    <div style="margin-top:8px">
      <button class="btn primary" id="btnSaveAccounts">保存</button>
      <span id="acctStatus"></span>
    </div>
  </section>
</main>

<main id="tab-logs" class="tabpane hidden">
  <section style="grid-column: 1 / -1;">
    <pre class="log" id="logBox">ここに /api/publish の結果が表示されます。</pre>
  </section>
</main>

<script>
  // ---- 初期データ（サーバ埋め込み） ----
  const SERVER_ACCOUNTS = {{ (accounts|tojson)|safe if accounts is defined else '[]' }};
  const SERVER_MATERIALS = {{ (materials|tojson)|safe if materials is defined else '[]' }};
  const INITIAL_COMMENTS = {{ (initial_comments|tojson)|safe if initial_comments is defined else '{}' }};

  // ---- タブ ----
  const tabs = document.querySelectorAll('.tab');
  const panes = document.querySelectorAll('.tabpane');
  tabs.forEach(t => t.onclick = () => {
    tabs.forEach(x => x.classList.remove('active'));
    panes.forEach(p => p.classList.add('hidden'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.remove('hidden');
  });

  // ---- アカウント ----
  const accountSelect = document.getElementById('accountSelect');
  function renderAccounts(accs){
    accountSelect.innerHTML = '';
    accs.forEach(a=>{
      const opt = document.createElement('option');
      opt.value = a.no;
      opt.textContent = `#${a.no}`;
      accountSelect.appendChild(opt);
    });
  }
  renderAccounts(SERVER_ACCOUNTS);

  // アカウント編集タブ
  const accountsJson = document.getElementById('accountsJson');
  accountsJson.value = JSON.stringify(SERVER_ACCOUNTS, null, 2);
  document.getElementById('btnSaveAccounts').onclick = async () => {
    try{
      const arr = JSON.parse(accountsJson.value || '[]');
      const res = await fetch('/api/accounts', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({accounts:arr})});
      const data = await res.json();
      document.getElementById('acctStatus').textContent = data.ok ? '保存OK' : ('保存失敗: '+(data.error||''));
      if(data.ok){ renderAccounts(arr); }
    }catch(e){
      document.getElementById('acctStatus').textContent = '保存失敗: '+e;
    }
  };

  // ---- 素材リスト / コメント1:1 ----
  const materialsBox = document.getElementById('materials');
  const commentList = document.getElementById('commentList');
  let MATERIALS = [...SERVER_MATERIALS];
  const commentMap = Object.assign({}, INITIAL_COMMENTS); // { filename: comment }

  function matRow(name){
    const wrap = document.createElement('div'); wrap.className='mat';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.value=name;
    const th = document.createElement(name.match(/\.(mp4|mov|m4v|avi|mkv|webm)$/i)?'video':'img');
    th.className='thumb';
    th.src = `/static/overlay_input/${name}`;
    if(th.tagName==='VIDEO'){ th.muted=true; th.loop=true; th.playsInline=true; th.autoplay=true; th.src += '#t=0.1'; th.style.objectFit='cover'; }
    const label = document.createElement('div'); label.textContent = name;
    wrap.appendChild(cb); wrap.appendChild(th); wrap.appendChild(label);
    return wrap;
  }

  function cmtRow(name){
    const row = document.createElement('div'); row.className='row';
    const lab = document.createElement('div'); lab.textContent = name;
    const ta  = document.createElement('textarea'); ta.placeholder='（空ならランダムテキストから自動）';
    ta.value = commentMap[name] || '';
    ta.oninput = ()=>{ commentMap[name] = ta.value; }
    row.appendChild(lab); row.appendChild(ta);
    return row;
  }

  function renderMaterials(){
    materialsBox.innerHTML=''; commentList.innerHTML='';
    MATERIALS.forEach(name=>{
      materialsBox.appendChild(matRow(name));
      commentList.appendChild(cmtRow(name));
    });
  }
  renderMaterials();

  // ---- アップロード ----
  document.getElementById('btnUpload').onclick = async () => {
    const inp = document.getElementById('fileInput');
    if(!inp.files.length) return;
    const fd = new FormData();
    for(const f of inp.files){ fd.append('files[]', f, f.name); }
    try{
      const res = await fetch('/upload', {method:'POST', body: fd});
      const text = await res.text();
      let data; try{ data = JSON.parse(text); }catch{ data = {ok:false, error:`HTTP ${res.status}: ${text.slice(0,200)}`} }
      if(data.ok){
        MATERIALS = data.materials || [];
        MATERIALS.forEach(m=>{ if(!(m in commentMap)) commentMap[m]=''; });
        renderMaterials();
      }else{
        alert('アップロード失敗: '+(data.error||''));
      }
    }catch(e){
      alert('アップロード失敗: '+e);
    }
  };

  // ---- 投稿 ----
  function selectedMaterials(){
    return [...materialsBox.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);
  }

  async function publish(materials){
    const account_no = parseInt(accountSelect.value||'0',10);
    const share_to_feed = document.getElementById('shareToFeed').checked;
    const comments = {};
    materials.forEach(m => comments[m] = (commentMap[m]||''));
    const payload = { account_no, share_to_feed, comments };
    if(materials.length) payload.materials = materials;

    const res = await fetch('/api/publish', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    const text = await res.text();
    let data; try{ data = JSON.parse(text); }catch{ data = {ok:false, error:`HTTP ${res.status}: ${text.slice(0,200)}`} }
    return data;
  }

  const logBox = document.getElementById('logBox');

  document.getElementById('btnPostSelected').onclick = async () => {
    const mats = selectedMaterials();
    const data = await publish(mats);
    logBox.textContent = JSON.stringify(data, null, 2);
    tabs.forEach(x=>x.classList.remove('active')); panes.forEach(p=>p.classList.add('hidden'));
    document.querySelector('.tab[data-tab="tab-logs"]').classList.add('active');
    document.getElementById('tab-logs').classList.remove('hidden');
  };

  document.getElementById('btnPostAll').onclick = async () => {
    const data = await publish([]); // 空→サーバ側で全素材
    logBox.textContent = JSON.stringify(data, null, 2);
    tabs.forEach(x=>x.classList.remove('active')); panes.forEach(p=>p.classList.add('hidden'));
    document.querySelector('.tab[data-tab="tab-logs"]').classList.add('active');
    document.getElementById('tab-logs').classList.remove('hidden');
  };

  // ---- ランダムテキスト保存 ----
  document.getElementById('btnSaveRandom').onclick = async () => {
    const texts = document.getElementById('randomTexts').value || '';
    try{
      const res = await fetch('/api/random_texts/save',{method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({texts})});
      const data = await res.json();
      document.getElementById('randStatus').textContent = data.ok ? '保存OK' : ('保存失敗: '+(data.error||''));
    }catch(e){
      document.getElementById('randStatus').textContent = '保存失敗: '+e;
    }
  };
</script>
</body>
</html>
