<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>投稿</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "ヒラギノ角ゴ ProN", "Hiragino Kaku Gothic ProN", "メイリオ", Meiryo, sans-serif; padding: 16px; }
    .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .btn { background:#198754; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; }
    .btn.sub { background:#0d6efd; }
    .btn.warn { background:#dc3545; }
    .btn.gray { background:#6c757d; }
    select, input[type="text"], input[type="number"] { padding:6px 8px; border:1px solid #ccc; border-radius:6px; }
    .switch { display:inline-flex; align-items:center; gap:6px; }
    .panel { border:1px solid #ddd; border-radius:10px; padding:14px; margin-top:10px; }
    .header { font-weight:700; font-size:18px; margin-bottom:8px; }
    table { width:100%; border-collapse:collapse; }
    th, td { border-bottom:1px solid #eee; padding:10px; vertical-align:top; }
    th { color:#333; }
    .thumb { width:120px; height:120px; object-fit:cover; border:1px solid #ddd; border-radius:6px; cursor:zoom-in; }
    .empty { color:#888; padding:8px 0; }
    .col-thumb { width:140px; }
    .col-filename { width:240px; color:#666; }
    .col-text { min-width:260px; }
    .row { cursor:grab; }
    .progress { height:8px; background:#f2f2f2; border-radius:6px; overflow:hidden; }
    .bar { height:100%; width:0%; background:#0d6efd; transition:width .2s; }
    .right { margin-left:auto; }
    .check { transform:scale(1.2); }
    .muted { color:#6c757d; font-size:12px; }
  </style>
  <!-- SortableJS for D&D 並び替え -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
</head>
<body>
  <!-- 上部ツールバー -->
  <div class="toolbar">
    <strong>投稿</strong>
    <label>番号
      <input id="accountNo" type="number" value="1" min="1" style="width:80px">
    </label>
    <select id="accountSelect"></select>
    <button id="tokenRefresh" class="btn sub">トークン更新</button>
    <button id="tokenCheck" class="btn sub">トークン有効期限チェック</button>
    <button id="tokenRevoke" class="btn warn">削除</button>

    <label class="switch">
      <input id="allAccounts" type="checkbox">
      <span>全アカウント（分散投稿）</span>
    </label>

    <button id="reload" class="btn gray">更新</button>
    <button id="doPost" class="btn right btn">投稿実行</button>
  </div>

  <!-- 素材一覧 -->
  <div class="panel">
    <div class="header">overlay_input の素材一覧（外部D&D移動、右列ダブルクリックでテキスト編集、サムネダブルクリックで拡大）</div>

    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <label class="btn gray">
        + 素材追加…（iPhone）
        <input id="fileInput" type="file" accept="image/*,video/*" multiple style="display:none">
      </label>
      <button id="removeSelected" class="btn warn">素材削除</button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:32px;"></th>
          <th class="col-thumb">サムネ</th>
          <th class="col-filename">ファイル名</th>
          <th class="col-text">テキスト（空ならランダム）</th>
        </tr>
      </thead>
      <tbody id="materialsBody">
        <tr id="emptyRow"><td colspan="4" class="empty">素材がありません。上の「+素材追加…」からアップロードしてください。</td></tr>
      </tbody>
    </table>

    <div style="margin-top:12px;">
      <div class="progress"><div id="progBar" class="bar"></div></div>
      <div class="muted">進捗</div>
    </div>
  </div>

  <script>
    // ---- 状態 ----
    let accounts = [];
    let materials = [];   // [{name, url, text, selected}]
    const bodyEl = document.getElementById('materialsBody');
    const emptyEl = document.getElementById('emptyRow');
    const accountSel = document.getElementById('accountSelect');
    const accountNoEl = document.getElementById('accountNo');

    // ---- 初期化 ----
    init();

    async function init() {
      await loadAccounts();
      await loadMaterials();
      wireToolbar();
      makeSortable();
    }

    async function loadAccounts() {
      const r = await fetch('/api/accounts');
      accounts = await r.json();
      accountSel.innerHTML = '';
      accounts.forEach((a, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx+1);
        opt.textContent = `${idx+1}. ${a.label} (IG:${a.ig_user_id} / Page:${a.page_id})`;
        accountSel.appendChild(opt);
      });
      // 番号 → セレクト連動
      const n = Number(accountNoEl.value||1);
      if (n>=1 && n<=accounts.length) accountSel.value = String(n);
      accountNoEl.addEventListener('change', ()=>accountSel.value = String(Number(accountNoEl.value||1)));
      accountSel.addEventListener('change', ()=>accountNoEl.value = String(Number(accountSel.value||1)));
    }

    async function loadMaterials() {
      const r = await fetch('/api/materials');
      materials = await r.json(); // [{name,url,text}]
      materials.forEach(m => m.selected = false);
      renderRows();
    }

    function renderRows() {
      bodyEl.innerHTML = '';
      if (!materials.length) {
        bodyEl.appendChild(emptyEl);
        emptyEl.style.display='table-row';
        return;
      }
      emptyEl.style.display='none';
      materials.forEach((m, idx) => {
        const tr = document.createElement('tr');
        tr.className = 'row';
        tr.dataset.name = m.name;

        // check
        const td0 = document.createElement('td');
        const ck = document.createElement('input');
        ck.type='checkbox'; ck.className='check';
        ck.checked = !!m.selected;
        ck.addEventListener('change', ()=>m.selected = ck.checked);
        td0.appendChild(ck);

        // thumb
        const td1 = document.createElement('td');
        const img = document.createElement('img');
        img.src = m.url; img.className = 'thumb';
        img.ondblclick = ()=>window.open(m.url, '_blank');
        td1.appendChild(img);

        // filename（表示だけ）
        const td2 = document.createElement('td');
        td2.textContent = m.name;

        // text
        const td3 = document.createElement('td');
        const inp = document.createElement('input');
        inp.type='text'; inp.value = m.text||''; inp.style.width='100%';
        inp.placeholder='空ならランダム';
        inp.addEventListener('change', async()=>{
          m.text = inp.value;
          await fetch('/api/update_text', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ name: m.name, text: m.text })
          });
        });
        // 右列ダブルクリックでも編集開始
        td3.ondblclick = ()=>{ inp.focus(); inp.select(); };
        td3.appendChild(inp);

        tr.append(td0, td1, td2, td3);
        bodyEl.appendChild(tr);
      });
    }

    function makeSortable() {
      new Sortable(bodyEl, {
        animation: 150,
        handle: '.row',
        onEnd: async () => {
          const order = [...bodyEl.querySelectorAll('tr.row')].map(tr=>tr.dataset.name);
          await fetch('/api/update_order', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ order })
          });
        }
      });
    }

    function wireToolbar() {
      document.getElementById('fileInput').addEventListener('change', async (e) => {
        const files = e.target.files;
        if (!files || !files.length) return;
        const fd = new FormData();
        for (const f of files) fd.append('files', f);
        const r = await fetch('/api/upload', { method:'POST', body: fd });
        if (!r.ok) { alert('アップロード失敗'); return; }
        await loadMaterials();
        e.target.value='';
      });

      document.getElementById('removeSelected').addEventListener('click', async ()=>{
        const names = materials.filter(m=>m.selected).map(m=>m.name);
        if (!names.length) { alert('削除する素材をチェックしてください'); return; }
        if (!confirm(`${names.length}件を削除しますか？`)) return;
        const r = await fetch('/api/remove', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ names })
        });
        if (!r.ok) { alert('削除に失敗'); return; }
        await loadMaterials();
      });

      document.getElementById('reload').addEventListener('click', async ()=>{
        await loadMaterials();
      });

      document.getElementById('doPost').addEventListener('click', async ()=>{
        const account_no = Number(accountNoEl.value||1);
        const all = document.getElementById('allAccounts').checked;
        const selected = materials.filter(m=>m.selected).map(m=>m.name);
        const body = { account_no, all_accounts: all, selected_names: selected };
        setBar(5);
        const r = await fetch('/api/post', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        const txt = await r.text();
        if (r.headers.get('content-type')?.includes('application/json')) {
          const data = JSON.parse(txt);
          alert(data.message || '完了');
        } else {
          // 何かの例外をそのまま返してる場合
          alert(txt);
        }
        setBar(100);
        setTimeout(()=>setBar(0), 800);
      });

      // 飾りボタン（ルーティンは既存のAPIに繋ぐなら差替）
      document.getElementById('tokenRefresh').onclick = ()=>window.location.href='/tokens/refresh';
      document.getElementById('tokenCheck').onclick = ()=>window.location.href='/tokens/status';
      document.getElementById('tokenRevoke').onclick = ()=>window.location.href='/tokens/revoke';
    }

    function setBar(p){ document.getElementById('progBar').style.width = `${p}%`; }
  </script>
</body>
</html>
