<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reel Poster</title>
  <style>
    :root{--bg:#0f1115;--panel:#151923;--muted:#8b92a2;--text:#e9eef5;--line:#273042;--accent:#4c8dff;--danger:#ff5d5d}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial}
    .wrap{max-width:1200px;margin:18px auto;padding:0 14px}
    .toolbar{position:sticky;top:0;background:linear-gradient(#151a25,#131824);border:1px solid var(--line);border-radius:10px;padding:10px;z-index:50}
    .toolbar .grid{display:grid;grid-template-columns:repeat(6,1fr) 160px 160px;gap:8px;align-items:center}
    .toolbar label{font-size:12px;color:#cdd5e2}
    .toolbar input[type=text]{width:100%;background:#101525;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px}
    .toolbar .btn{background:#101525;border:1px solid var(--line);color:var(--text);padding:8px 10px;border-radius:8px;font-size:13px;cursor:pointer}
    .toolbar .btn.primary{background:var(--accent);border-color:#3a78ff;color:#fff;font-weight:600}
    .toolbar .btn.danger{background:#271519;border-color:#4a1e27;color:#ffb3b3}
    .toolbar .row{display:flex;gap:8px;align-items:center}
    .toolbar select{width:100%;background:#101525;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px}

    .tabs{display:flex;gap:6px;margin:12px 0}
    .tab{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#121726;color:var(--muted);cursor:pointer}
    .tab.active{background:var(--panel);color:var(--text)}
    .panel{display:none;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px}
    .panel.active{display:block}

    /* 投稿レイアウト（元UIに合わせて左サムネ/中央ファイル名/右テキスト） */
    .materials{border:1px solid var(--line);border-radius:10px;background:#121726}
    .mat-head,.mat-row{display:grid;grid-template-columns:160px 1fr 1.5fr;gap:10px;align-items:center}
    .mat-head{position:sticky;top:64px;background:#111626;border-bottom:1px solid var(--line);padding:8px 10px;font-size:12px;color:#cfd7e6;z-index:5}
    .mat-body{max-height:520px;overflow:auto;padding:10px}
    .thumb{width:140px;aspect-ratio:1/1;background:#0f1422;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center}
    .thumb img,.thumb video{max-width:100%;max-height:100%}
    .mat-row{border-bottom:1px dashed #223048;padding:10px 0}
    textarea{width:100%;min-height:70px;background:#0f1422;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px;resize:vertical}

    .filedrop{position:relative;border:1px dashed #3a465e;border-radius:10px;background:#0f1422;padding:12px;text-align:center;margin:10px 0}
    .filedrop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
    .muted{color:var(--muted);font-size:12px}
    .bar{display:flex;gap:8px;align-items:center;margin:10px 0}
    .log{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#0f1422;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto}
  </style>
</head>
<body>
<div class="wrap">

  <!-- ① アカウント＆トークン操作：常時トップ固定（元UIのまま） -->
  <div class="toolbar">
    <div class="grid">
      <div>
        <label>番号</label>
        <input id="acctNo" type="text" placeholder="例: 1">
      </div>
      <div>
        <label>ラベル</label>
        <input id="acctLabel" type="text" placeholder="任意の表示名">
      </div>
      <div>
        <label>IGユーザーID</label>
        <input id="acctIG" type="text" placeholder="1784...">
      </div>
      <div>
        <label>ページID</label>
        <input id="acctPage" type="text" placeholder="5750...">
      </div>
      <div>
        <label>選択</label>
        <select id="accountSelect"></select>
      </div>
      <div class="row">
        <button class="btn" id="btnAcctAdd">+追加/更新</button>
        <button class="btn" id="btnTokenNew">トークン</button>
        <button class="btn" id="btnTokenCheck">トークン有効期限チェック</button>
        <button class="btn danger" id="btnAcctDel">削除</button>
      </div>
      <div class="row">
        <label class="muted"><input type="checkbox" id="allAccounts"> 全アカウント（分散投稿）</label>
        <button class="btn" id="btnToolbarReload">更新</button>
        <button class="btn primary" id="btnPost">投稿実行</button>
      </div>
    </div>
    <div class="muted" id="toolbarNote"></div>
  </div>

  <!-- タブ（投稿/ランダムテキスト/投稿ログ）。※ツールバーは常に上に残る -->
  <div class="tabs">
    <div class="tab active" data-tab="post">投稿</div>
    <div class="tab" data-tab="random">ランダムテキスト</div>
    <div class="tab" data-tab="logs">投稿ログ</div>
  </div>

  <!-- ② 投稿 -->
  <section id="post" class="panel active">
    <div class="filedrop">
      <div>＋素材追加…（外部選択や移動）</div>
      <div class="muted">画像/動画 複数可。DnDで並び替えはブラウザ依存なので、順番は投稿時にサーバ側でソート（ファイル名昇順）に揃えます。</div>
      <input id="fileInput" type="file" accept="image/*,video/*" multiple>
    </div>

    <div class="materials">
      <div class="mat-head">
        <div>サムネ</div>
        <div>ファイル名</div>
        <div>テキスト（空ならランダム）</div>
      </div>
      <div class="mat-body" id="matBody"></div>
    </div>

    <div class="bar">
      <button class="btn" id="btnRemoveSelected">素材削除</button>
      <span class="muted">チェックされた行を削除。選択が無ければ何もしません。</span>
    </div>

    <div>
      <h4 style="margin:10px 0 6px">進捗</h4>
      <div class="log" id="logBox">待機中</div>
    </div>
  </section>

  <!-- ③ ランダムテキスト -->
  <section id="random" class="panel">
    <div class="bar">
      <button class="btn" id="btnRandAdd">行を追加</button>
      <span class="muted" id="randMsg"></span>
    </div>
    <div id="randList"></div>
  </section>

  <!-- ④ 投稿ログ -->
  <section id="logs" class="panel">
    <div class="bar">
      <button class="btn" id="btnReloadLogs">更新</button>
    </div>
    <div class="log" id="logsBox">（ログなし）</div>
  </section>
</div>

<script>
  // タブ
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById(t.dataset.tab).classList.add('active');
    });
  });

  // 状態
  const S = { items: [], comments: {}, selectedRows: new Set(), randomTexts: [] };
  const matBody = document.getElementById('matBody');
  const logBox  = document.getElementById('logBox');

  // アカウント読み込み（accounts.json → /api/accounts のどちらでもOK）
  async function loadAccounts() {
    let js = {accounts:[]};
    try {
      const r = await fetch('/api/accounts'); if(r.ok) js = await r.json();
      else throw 0;
    } catch {
      try {
        const r2 = await fetch('/static/accounts.json'); if(r2.ok) js = await r2.json();
      } catch {}
    }
    const sel = document.getElementById('accountSelect');
    sel.innerHTML = '';
    (js.accounts||[]).forEach(a=>{
      const o = document.createElement('option');
      o.value = a.account_no; o.textContent = `${a.account_no}. ${a.name||''} (IG:${a.ig_user_id||''} / Page:${a.page_id||''})`;
      sel.appendChild(o);
    });
    document.getElementById('toolbarNote').textContent = js.accounts?.length ? '' : 'accounts.json が読み込めません。/api/accounts も空です。';
  }

  // アカウント操作（エンドポイント名は従来どおり想定）
  document.getElementById('btnToolbarReload').onclick = loadAccounts;
  document.getElementById('btnAcctAdd').onclick = async ()=>{
    const payload = {
      account_no: (document.getElementById('acctNo').value||'').trim(),
      name: (document.getElementById('acctLabel').value||'').trim(),
      ig_user_id: (document.getElementById('acctIG').value||'').trim(),
      page_id: (document.getElementById('acctPage').value||'').trim()
    };
    await fetch('/api/accounts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});
    loadAccounts();
  };
  document.getElementById('btnAcctDel').onclick = async ()=>{
    const no = (document.getElementById('acctNo').value||'').trim();
    if(!no) return;
    await fetch('/api/accounts/'+encodeURIComponent(no),{method:'DELETE'}).catch(()=>{});
    loadAccounts();
  };
  document.getElementById('btnTokenNew').onclick = ()=> window.open('/tokens', '_blank');
  document.getElementById('btnTokenCheck').onclick = ()=> window.open('/tokens/status', '_blank');

  // 素材の追加
  function addFiles(files){
    Array.from(files).forEach(f=>{
      const id = `${Date.now()}_${Math.random().toString(16).slice(2)}`;
      const url = URL.createObjectURL(f);
      const type = f.type.startsWith('video') ? 'video' : 'image';
      S.items.push({id, file:f, url, type, name:f.name});
      S.comments[id] = S.comments[id] || '';
    });
    renderRows();
  }
  document.getElementById('fileInput').addEventListener('change',e=>addFiles(e.target.files));

  // 行描画（左サムネ／中央ファイル名／右テキスト）
  function renderRows(){
    matBody.innerHTML = '';
    S.items.forEach(item=>{
      const row = document.createElement('div'); row.className='mat-row';
      const left = document.createElement('div');
      const thumb = document.createElement('label'); thumb.className='thumb'; thumb.title='クリックで選択';
      const chk = document.createElement('input'); chk.type='checkbox'; chk.style.marginRight='6px';
      chk.checked = S.selectedRows.has(item.id);
      chk.addEventListener('change',()=>{ if(chk.checked) S.selectedRows.add(item.id); else S.selectedRows.delete(item.id); });
      const box = document.createElement(item.type==='image'?'img':'video'); box.src=item.url; if(item.type==='video'){box.muted=true;box.playsInline=true;}
      left.appendChild(chk); thumb.appendChild(box); left.appendChild(thumb);

      const mid = document.createElement('div'); mid.textContent = item.name; mid.style.fontSize='12px'; mid.style.color='#cfd7e6';

      const right = document.createElement('div');
      const ta = document.createElement('textarea'); ta.placeholder='空ならランダムテキスト';
      ta.value = S.comments[item.id] || '';
      ta.addEventListener('input',()=>{ S.comments[item.id] = ta.value; });
      right.appendChild(ta);

      row.appendChild(left); row.appendChild(mid); row.appendChild(right);
      matBody.appendChild(row);
    });
  }

  // 素材削除
  document.getElementById('btnRemoveSelected').onclick = ()=>{
    if(S.selectedRows.size===0) return;
    S.items = S.items.filter(x=>!S.selectedRows.has(x.id));
    S.selectedRows.clear();
    renderRows();
  };

  // ランダムテキスト
  async function loadRandom(){ try{
    const r = await fetch('/api/random_texts'); const js = await r.json();
    S.randomTexts = js.items||[];
  }catch{ S.randomTexts = []; }
    renderRandom();
  }
  function renderRandom(){
    const box = document.getElementById('randList'); box.innerHTML='';
    S.randomTexts.forEach((t,i)=>{
      const row = document.createElement('div'); row.style.display='flex'; row.style.gap='8px'; row.style.margin='6px 0';
      const inp = document.createElement('input'); inp.type='text'; inp.value=t; inp.style.flex='1';
      const del = document.createElement('button'); del.className='btn'; del.textContent='削除';
      inp.addEventListener('input', debounce(async ()=>{
        S.randomTexts[i]=inp.value; await saveRandom();
      },350));
      del.onclick = async ()=>{ S.randomTexts.splice(i,1); await saveRandom(); renderRandom(); };
      row.appendChild(inp); row.appendChild(del); box.appendChild(row);
    });
  }
  async function saveRandom(){
    const m = document.getElementById('randMsg'); m.textContent='保存中…';
    await fetch('/api/random_texts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:S.randomTexts})}).catch(()=>{});
    m.textContent='保存しました'; setTimeout(()=>m.textContent='',1200);
  }
  document.getElementById('btnRandAdd').onclick = async ()=>{ S.randomTexts.push(''); await saveRandom(); renderRandom(); };

  // 投稿実行（選択があれば選択のみ、無ければ全部）
  document.getElementById('btnPost').onclick = async ()=>{
    const accountNo = document.getElementById('accountSelect').value;
    const allAccounts = document.getElementById('allAccounts').checked;
    if(!accountNo && !allAccounts){ alert('アカウントを選択してください'); return; }

    let targets = S.items;
    if(S.selectedRows.size>0) targets = S.items.filter(x=>S.selectedRows.has(x.id));
    if(targets.length===0){ alert('素材がありません'); return; }

    // 1) サーバへアップロード
    const uploaded = [];
    for(const it of targets){
      const fd = new FormData(); fd.append('file', it.file);
      const r = await fetch('/api/upload',{method:'POST',body:fd});
      const js = await r.json().catch(()=>({}));
      if(!r.ok || !js.path){ appendLog(`アップロード失敗: ${it.name}`); continue; }
      uploaded.push({ server_path: js.path, comment: (S.comments[it.id]||'').trim() });
    }
    if(uploaded.length===0){ appendLog('投稿対象がありません'); return; }

    // 2) バッチ投稿
    const payload = { account_no: accountNo?parseInt(accountNo,10):null, all_accounts: !!allAccounts, items: uploaded };
    const r2 = await fetch('/api/post_batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const js2 = await r2.json().catch(()=>({error:'JSONパース失敗'}));
    if(!r2.ok){ appendLog('投稿失敗: '+(js2.error||r2.statusText)); return; }
    appendLog(js2.message || '投稿を受け付けました');
  };

  // ログ
  function appendLog(t){ if(logBox.textContent==='待機中') logBox.textContent=''; logBox.textContent += (logBox.textContent?'\n':'')+t; logBox.scrollTop=logBox.scrollHeight; }
  document.getElementById('btnReloadLogs').onclick = async ()=>{
    const r = await fetch('/api/logs'); const js = await r.json().catch(()=>({lines:[]}));
    document.getElementById('logsBox').textContent = (js.lines||[]).join('\n') || '（ログなし）';
  };

  // ユーティリティ
  function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms);} }

  // 初期化
  (async function init(){
    await loadAccounts();
    await loadRandom();
    document.getElementById('btnReloadLogs').click();
  })();
</script>
</body>
</html>
