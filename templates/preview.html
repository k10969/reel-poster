<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;padding:24px;background:#f2f3f5}
    .section{max-width:980px;margin:0 auto}
    .card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:16px 0}
    video,img{width:100%;max-height:70vh;border-radius:8px;border:1px solid #eee}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    button{padding:8px 12px;border:1px solid #ccc;border-radius:8px;background:#fafafa;cursor:pointer}
    button:hover{background:#f0f0f0}
    .muted{color:#666;font-size:12px}
  </style>
</head>
<body>
  <div class="section">
    <div class="card">
      <div class="row">
        <button onclick="history.back()">← 戻る</button>
        <div class="muted">{{ kind }} / {{ filename }}</div>
      </div>
    </div>

    <div class="card">
      {% if is_video %}
        <video controls playsinline src="/{{ file_url }}"></video>
      {% else %}
        <img src="/{{ file_url }}" alt="">
      {% endif %}
    </div>

    {% if kind == 'output' %}
    <div class="card">
      <div class="row">
        <button onclick="location.href='{{ url_for('download_output', filename=filename) }}'">この動画をダウンロード</button>
        <span class="muted">（iPhoneは長押し保存でもOK）</span>
      </div>
    </div>
    {% endif %}
  </div>
</body>
</html>
